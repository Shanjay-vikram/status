{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-3"><h1 class="h2">Customers</h1><a class="btn btn-primary" href="{{ url_for('main.customer_new') }}">＋ Add customer</a></div><div class="card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Code</th><th>Company</th><th>Contact</th><th>Email</th><th>Phone</th></tr></thead><tbody>{% for c in customers %}<tr><td>{{ c.customer_code }}</td><td>{{ c.legal_name }}</td><td>{{ c.contact_name or '—' }}</td><td>{{ c.email or '—' }}</td><td>{{ c.phone or '—' }}</td></tr>{% else %}<tr><td colspan="5" class="text-center text-muted py-4">No customers yet.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
