{% extends 'base.html' %}{% block content %}<h1 class="h2 mb-3">Create user account</h1><form method="post" class="card card-body form-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Full name *</label><input class="form-control" name="full_name" required></div><div class="col-md-6"><label class="form-label">Username *</label><input class="form-control" name="username" required></div><div class="col-md-6"><label class="form-label">Email *</label><input class="form-control" type="email" name="email" required></div><div class="col-md-6"><label class="form-label">Temporary password * (10+ characters)</label><input class="form-control" type="password" name="password" minlength="10" required></div><div class="col-md-6"><label class="form-label">Role *</label><select class="form-select" name="role" id="role" required><option value="">Choose role</option>{% for r in ['ADMIN','SUPPORT','ENGINEER','MANAGEMENT','CUSTOMER'] %}<option>{{ r }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Customer (required for CUSTOMER role)</label><select class="form-select" name="customer_id"><option value="">Not applicable</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.customer_code }} — {{ c.legal_name }}</option>{% endfor %}</select></div></div><div class="mt-4"><button class="btn btn-primary">Create account</button> <a class="btn btn-outline-secondary" href="{{ url_for('main.users') }}">Cancel</a></div></form>{% endblock %}
