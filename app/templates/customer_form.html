{% extends 'base.html' %}{% block content %}<h1 class="h2 mb-3">Add customer</h1><form method="post" class="card card-body form-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-4"><label class="form-label">Customer code *</label><input class="form-control" name="customer_code" required></div><div class="col-md-8"><label class="form-label">Company / legal name *</label><input class="form-control" name="legal_name" required></div><div class="col-md-6"><label class="form-label">Contact person</label><input class="form-control" name="contact_name"></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email"></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div><div class="col-12"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="3"></textarea></div></div><div class="mt-4"><button class="btn btn-primary">Save customer</button> <a class="btn btn-outline-secondary" href="{{ url_for('main.customers') }}">Cancel</a></div></form>{% endblock %}
