{% extends 'base.html' %}{% block content %}<h1 class="h2 mb-3">Create parent ticket</h1><form method="post" class="card card-body form-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-7"><label class="form-label">Customer *</label><select class="form-select" name="customer_id" required><option value="">Choose customer</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.customer_code }} — {{ c.legal_name }}</option>{% endfor %}</select></div><div class="col-md-5"><label class="form-label">Priority</label><select class="form-select" name="priority"><option>MEDIUM</option><option>LOW</option><option>HIGH</option><option>CRITICAL</option></select></div><div class="col-12"><label class="form-label">Ticket subject *</label><input class="form-control" name="subject" required></div><div class="col-12"><label class="form-label">Overall description *</label><textarea class="form-control" name="description" rows="3" required></textarea></div></div><hr><div class="d-flex justify-content-between align-items-center"><h2 class="h5">Problems under this ticket</h2><button type="button" class="btn btn-sm btn-outline-primary" onclick="addProblem()">＋ Add problem</button></div><div id="problems"><div class="problem-entry border rounded p-3 mb-3"><div class="row g-2"><div class="col-md-6"><label class="form-label">Problem title *</label><input class="form-control" name="problem_title[]" required></div><div class="col-md-3"><label class="form-label">Severity</label><select class="form-select" name="severity[]"><option>MEDIUM</option><option>LOW</option><option>HIGH</option><option>CRITICAL</option></select></div><div class="col-md-3"><label class="form-label">Assign engineer</label><select class="form-select" name="engineer_id[]"><option value="">Unassigned</option>{% for e in engineers %}<option value="{{ e.id }}">{{ e.full_name }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Problem description</label><textarea class="form-control" name="problem_description[]" rows="2"></textarea></div></div></div></div><button class="btn btn-primary">Create ticket</button></form>{% endblock %}{% block scripts %}<script>function addProblem(){const first=document.querySelector('.problem-entry');const copy=first.cloneNode(true);copy.querySelectorAll('input,textarea').forEach(x=>x.value='');copy.querySelectorAll('select').forEach(x=>x.selectedIndex=0);const remove=document.createElement('button');remove.type='button';remove.className='btn btn-sm btn-outline-danger mt-2';remove.textContent='Remove problem';remove.onclick=()=>copy.remove();copy.appendChild(remove);document.getElementById('problems').appendChild(copy)}</script>{% endblock %}
