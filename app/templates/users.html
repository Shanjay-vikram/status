{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-3"><h1 class="h2">User accounts</h1><a class="btn btn-primary" href="{{ url_for('main.user_new') }}">＋ Create user</a></div><div class="card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Customer</th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.full_name }}</td><td>{{ u.username }}</td><td>{{ u.email }}</td><td><span class="badge text-bg-secondary">{{ u.role }}</span></td><td>{{ u.customer_id or '—' }}</td></tr>{% else %}<tr><td colspan="5" class="text-center text-muted py-4">No users found.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
